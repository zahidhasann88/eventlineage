asyncapi: 2.6.0
id: urn:shop:payments
info:
  title: Payments Service
  version: 3.4.1
  description: Publishes payment outcomes; consumes order events.
x-service-name: payment-gateway
x-namespace: shop.payments

servers:
  production:
    url: kafka.shop.internal:9092
    protocol: kafka

defaultContentType: application/json

channels:
  payments.v1:
    description: Payment lifecycle events.
    subscribe:
      operationId: onPaymentCaptured
      message:
        $ref: '#/components/messages/PaymentCaptured'
    publish:
      operationId: onOrderCreated
      message:
        $ref: '#/components/messages/OrderCreated'
  orders.v1:
    description: Orders topic consumed by the gateway.
    publish:
      operationId: watchOrders
      message:
        $ref: '#/components/messages/OrderCreated'

components:
  messages:
    PaymentCaptured:
      name: payments.captured
      title: Payment captured
      schemaFormat: application/vnd.apache.avro+json;version=1.9.0
      payload:
        $ref: '../schemas/payments.captured.avsc'
    OrderCreated:
      name: orders.created
      title: Order created
      payload:
        $ref: '../schemas/orders.created.v1_2.json'
