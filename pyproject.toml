[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "eventlineage"
dynamic = ["version"]
description = "Event dependency intelligence: discover, analyze, validate and understand event-driven architectures."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Zahid Hasan" }]
keywords = [
  "events",
  "event-driven-architecture",
  "asyncapi",
  "kafka",
  "avro",
  "protobuf",
  "json-schema",
  "dependency-graph",
  "architecture-analysis",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Documentation",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.6,<3",
  "typer>=0.12",
  "rich>=13.7",
  "PyYAML>=6.0",
  "jsonschema>=4.21",
  "typing-extensions>=4.9",
]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.3"]
rabbitmq = ["httpx>=0.27"]   # management HTTP API
nats = ["nats-py>=2.6"]
registry = ["httpx>=0.27"]   # Schema Registry REST API
schema-registry = ["httpx>=0.27"]   # same extra under the integration's own name
all = [
  "eventlineage[kafka]",
  "eventlineage[rabbitmq]",
  "eventlineage[nats]",
  "eventlineage[registry]",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.98",
  "ruff>=0.5",
  "mypy>=1.10",
  "build>=1.2",
  "networkx>=3.2",
  "types-PyYAML>=6.0",
]

[project.scripts]
eventlineage = "eventlineage.cli.main:main"

[project.urls]
Homepage = "https://github.com/zahidhasann88/eventlineage"
Documentation = "https://github.com/zahidhasann88/eventlineage/tree/main/docs"
Repository = "https://github.com/zahidhasann88/eventlineage"
Changelog = "https://github.com/zahidhasann88/eventlineage/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/zahidhasann88/eventlineage/issues"

[project.entry-points."eventlineage.discovery"]
# Third-party discovery plugins register themselves here:
# my-format = "mypackage.plugin:MyFormatPlugin"

[project.entry-points."eventlineage.rules"]
# Third-party validation rules register themselves here:
# my-rule = "mypackage.rules:MyRule"

[tool.hatch.version]
path = "src/eventlineage/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/eventlineage"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "benchmarks", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config -m 'not performance and not live'"
testpaths = ["tests"]
markers = [
  "performance: large-graph performance tests (slower, run with `-m performance`)",
  "slow: long running tests",
  "live: needs the brokers in tests/live/docker-compose.yml (run with `-m live`)",
]
filterwarnings = ["error::DeprecationWarning:eventlineage.*"]

[tool.coverage.run]
branch = true
source = ["eventlineage"]
omit = ["*/cli/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET", "PTH", "RUF",
  "PT", "T20", "ARG", "N", "PL", "D",
]
ignore = [
  "D203",    # conflicting: blank line before class docstring
  "D213",    # conflicting: multi-line summary on second line
  "D105",    # dunder methods: the name is the contract (__repr__, __str__, ...)
  "D107",    # __init__ is documented on the class
  "PLR0913", # many arguments are fine for model builders
  "PLR0917", # likewise for positional model/graph constructors
  "PLR2004", # magic values in tests/comparisons
  # Hook signatures are fixed by the plugin/rule protocol, so unused arguments
  # appear where one plugin needs less context than the interface provides.
  "ARG002",
  # Lazy imports are deliberate: `import eventlineage` must stay fast, and
  # optional dependencies (jsonschema, broker clients, typer) are imported on the
  # code path that actually needs them.
  "PLC0415",
  # Parsers, state machines and report renderers are long by nature; splitting
  # them for a line counter hurts readability more than it helps.
  "PLR0911",
  "PLR0912",
  "PLR0915",
]

[tool.ruff.lint.per-file-ignores]
# Test names carry the documentation; a docstring on every test method would
# repeat the name without adding information.
"tests/**" = ["D101", "D102", "D103", "PLR0915", "PLR0912", "S101", "ARG001", "ARG002", "PT011"]
"benchmarks/**" = ["D101", "D102", "D103", "T201", "PLR0915"]
"src/eventlineage/cli/**" = ["T201", "B008"]  # Typer uses function calls as defaults
"src/eventlineage/reporting/console.py" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
files = ["src/eventlineage"]
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
disallow_any_generics = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yaml.*", "jsonschema.*", "confluent_kafka.*", "nats.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "benchmarks.*"]
disallow_untyped_defs = false
